version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle_gaming_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-junglegaming}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d junglegaming"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
